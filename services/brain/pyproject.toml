[project]
name = "jarvis-brain"
version = "0.1.0"
description = "JARVIS orchestrator: agent runtime, providers, tools, knowledge, voice adapters, admin API"
requires-python = ">=3.12"
dependencies = [
  "jarvis-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "cryptography>=43",
  "pyyaml>=6.0",
  "numpy>=2.0",
  "websockets>=14",
  "anthropic>=1.0",
  "openai>=1.60",
  "pyotp>=2.9",
  "mcp>=1.2",
  "trafilatura>=2.0",
  "pypdf>=5.0",
  "jsonschema>=4.23",
  "sqlite-vec>=0.1.6",
  "networkx>=3.3",
]

[project.optional-dependencies]
# Offline voice on the brain host: Piper TTS + faster-whisper STT.
local-voice = ["piper-tts>=1.3", "faster-whisper>=1.1"]
# In-process embeddings (ONNX, no torch) when no embedding server is configured.
local-embeddings = ["fastembed>=0.4"]

[project.scripts]
jarvis-brain = "jarvis_brain.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_brain"]

[tool.uv.sources]
jarvis-protocol = { workspace = true }
