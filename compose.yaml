# JARVIS deployment. `make up` (or `docker compose up -d --build`) from the repo root.
#
# Profiles (set COMPOSE_PROFILES in .env):
#   brain  — orchestrator + admin API (ports 8000/9000)          → the brain host
#   pi     — kiosk UI server (127.0.0.1:8080) + audio node        → the Pi
#   qdrant — vector DB for knowledge (optional; sqlite-vec is the default)
#   tailnet — sidecar publishing the ports below on this machine's Tailscale IP/name
# Everything on one Pi: COMPOSE_PROFILES=brain,pi,tailnet (the default).
#
# Networking: jarvis services use the host network and bind to 127.0.0.1 (the brain refuses
# anything but loopback or a Tailscale IP). The `tailnet` sidecar forwards TAILNET_PORTS from the
# host's tailnet address to localhost, so from any of your tailnet devices:
#   http://<machine>:8080  kiosk UI     http://<machine>:9000  admin     (<machine> = name or 100.x IP)
# Nothing is published on 0.0.0.0 or the LAN. The kiosk browser runs on the host desktop.
# Boot: Docker starts at boot and every service is `restart: unless-stopped`; deploy/systemd also
# runs `compose up` at boot so the stack comes back even after `make down`.
name: jarvis

x-common: &common
  env_file: .env
  restart: unless-stopped
  network_mode: host
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  brain:
    <<: *common
    profiles: [brain]
    build:
      context: .
      dockerfile: deploy/docker/brain.Dockerfile
    image: jarvis/brain:latest
    environment:
      JARVIS_DATA_DIR: /data
    volumes:
      - jarvis-data:/data
      - ./skills:/app/skills
    mem_limit: 1200m

  ui:
    <<: *common
    profiles: [pi]
    build:
      context: .
      dockerfile: deploy/docker/ui.Dockerfile
    image: jarvis/ui:latest
    mem_limit: 64m
    read_only: true

  audio-node:
    <<: *common
    profiles: [pi]
    build:
      context: .
      dockerfile: deploy/docker/audio-node.Dockerfile
    image: jarvis/audio-node:latest
    # Same uid as the desktop user, so PipeWire's pulse socket accepts the connection.
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    group_add: ["${AUDIO_GID:-29}"]
    environment:
      PULSE_SERVER: unix:/run/user/${JARVIS_UID:-1000}/pulse/native
      ASOUND_DIR: /run/host-asound
    # Hot-plug: /dev/snd is bind-mounted (not `devices:`, which snapshots the nodes at start) and
    # the cgroup rule allows any ALSA device (major 116), so a USB mic plugged in later works.
    device_cgroup_rules: ["c 116:* rmw"]
    volumes:
      - /dev/snd:/dev/snd
      # Docker masks /proc/asound in containers; the node needs it to tell a real mic apart from
      # PipeWire's fallback (see audio_io.capture_devices).
      - /proc/asound:/run/host-asound:ro
      # /run/user/<uid> is a tmpfs mounted at login — rslave lets it appear in the container
      # even when the container started first (cold boot).
      - type: bind
        source: /run/user
        target: /run/user
        bind: { propagation: rslave }
    mem_limit: 400m

  tailnet:
    # Not <<: *common — it needs no secrets from .env, just the port list.
    restart: unless-stopped
    network_mode: host
    logging: { driver: json-file, options: { max-size: "1m", max-file: "2" } }
    profiles: [tailnet]
    # Tiny shell image; the tailscale CLI is the host's own (static) binary, so it always matches
    # the host's tailscaled version. Root here = root on the host socket, which serve requires.
    image: busybox:1.36.1
    init: true
    environment:
      TAILSCALE: /usr/local/bin/tailscale
      TAILNET_PORTS: ${TAILNET_PORTS:-8080 8000 9000}
    command: ["sh", "/serve.sh"]
    volumes:
      - ./deploy/tailnet/serve.sh:/serve.sh:ro
      - ${TAILSCALE_BIN:-/usr/bin/tailscale}:/usr/local/bin/tailscale:ro
      - /var/run/tailscale:/var/run/tailscale
    mem_limit: 64m
    read_only: true
    stop_grace_period: 5s

  qdrant:
    profiles: [qdrant]
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

volumes:
  jarvis-data:
  qdrant-data:
