[project]
name = "jarvis-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
description = "JARVIS monorepo (uv workspace root — not a distributable package)"

[tool.uv]
package = false
# openWakeWord declares tflite-runtime on Linux, which has no wheels for 3.12; we use its ONNX
# backend instead, so drop the dependency.
exclude-dependencies = ["tflite-runtime"]

[tool.uv.workspace]
members = ["packages/protocol", "services/brain", "services/audio-node"]

[tool.uv.sources]
jarvis-protocol = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "RUF001", "RUF002", "RUF003", # unicode punctuation in prose strings is intentional
  "RUF012",  # pydantic models copy mutable defaults
  "E501",    # the formatter owns line length; long SQL/prose strings are fine
]

[tool.ruff.lint.per-file-ignores]
"services/brain/src/jarvis_brain/providers/router.py" = ["S106"]  # secret *names*, not values
# Only internal table names and "?" placeholder lists are interpolated; values are always bound.
"services/brain/src/jarvis_brain/knowledge/*.py" = ["S608"]
"**/tests/**" = ["S", "B011", "SIM117", "E501", "ASYNC109", "ASYNC110", "RUF059"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/protocol/tests", "services/brain/tests", "services/audio-node/tests"]
addopts = "--import-mode=importlib"
