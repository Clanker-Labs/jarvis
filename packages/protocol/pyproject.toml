[project]
name = "jarvis-protocol"
version = "0.1.0"
description = "Typed WebSocket event protocol shared by every JARVIS service"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_protocol"]
